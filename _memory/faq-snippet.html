  <!-- FAQ dock: plain text until opened; theater boots on first click -->
  <section class="faq-dock" id="faq" data-faq>
    <div class="faq-dock-inner">
      <button type="button" class="faq-trigger" aria-expanded="false" aria-controls="faq-stage">
        Frequently asked questions
      </button>

      <div class="faq-stage" id="faq-stage" hidden>
        <div class="faq-stage-grid">
          <div class="faq-left">
            <div class="faq-speaker" aria-hidden="true">
              <svg class="faq-head" viewBox="0 0 80 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path class="faq-head-profile" d="M28 18c10-8 28-6 34 8 4 9 2 18-2 24 6 4 10 12 8 22-3 14-16 20-30 18-8-1-14-6-16-12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path class="faq-head-jaw" d="M22 70c2 8 10 14 22 14 8 0 14-2 18-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle class="faq-head-eye" cx="48" cy="40" r="1.6" fill="currentColor"/>
                <path class="faq-head-mouth" d="M42 56h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <g class="faq-voice" opacity="0">
                  <path d="M62 44h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M62 50h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M62 56h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </g>
              </svg>
            </div>

            <div class="faq-bubble">
              <div class="faq-thought-dots" aria-hidden="true">
                <span></span><span></span><span></span>
              </div>
              <p class="faq-bubble-label">Ask me</p>
              <div class="faq-q-list" role="list">
                <button type="button" class="faq-q" role="listitem" data-faq-i="0">What do you actually do?</button>
                <button type="button" class="faq-q" role="listitem" data-faq-i="1">Do I need a big budget to start?</button>
                <button type="button" class="faq-q" role="listitem" data-faq-i="2">Can you just build a site — or just run ads?</button>
                <button type="button" class="faq-q" role="listitem" data-faq-i="3">How long does a typical project take?</button>
                <button type="button" class="faq-q" role="listitem" data-faq-i="4">Do you only work with local businesses?</button>
                <button type="button" class="faq-q" role="listitem" data-faq-i="5">What happens after launch?</button>
              </div>
            </div>
          </div>

          <div class="faq-answer" aria-live="polite">
            <p class="faq-answer-label">Answer</p>
            <p class="faq-answer-text" data-faq-answer>Pick a question on the left.</p>
          </div>
        </div>

        <button type="button" class="faq-close">Close</button>
      </div>
    </div>
  </section>
